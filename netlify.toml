# ════════════════════════════════════════════════════════
#  netlify.toml — configurazione del sito
# ════════════════════════════════════════════════════════

[build]
  publish = "."
  functions = "netlify/functions"

# ── SICUREZZA: intestazioni HTTP per tutte le pagine ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://partner.googleadservices.com https://tpc.googlesyndication.com https://www.googletagservices.com https://fundingchoicesmessages.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://polangela.github.io https://raw.githubusercontent.com https://pagead2.googlesyndication.com https://tpc.googlesyndication.com https://www.google.com; connect-src 'self' https://raw.githubusercontent.com https://api.github.com https://pagead2.googlesyndication.com https://fundingchoicesmessages.google.com https://api.mymemory.translated.net; frame-src 'self' https://nevercodejam.netlify.app https://polangela.github.io https://tpc.googlesyndication.com https://googleads.g.doubleclick.net https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests;"

# ── Nessun X-Frame-Options per l'editor (permette iframe interno) ──
[[headers]]
  for = "/editortestuale_v2.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;"

# ── SICUREZZA: intestazioni per le Netlify Functions ──
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store, no-cache, must-revalidate"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
